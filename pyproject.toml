[project]
name = "powerpoint-reviewer"
version = "1.9.0"
description = "PowerPoint 讲稿朗读与审阅工具"
requires-python = ">=3.14,<3.15"
dependencies = [
    # 界面组件按已验证的组合锁定，避免 Fluent Widgets 的宽松依赖自动升级 Qt。
    "PySide6-Fluent-Widgets==1.11.3",
    # Qt 6.11.3 的样式回归会将数值框编辑区压缩到 1 像素，暂用 6.11.2。
    "PySide6==6.11.2",
    "python-docx>=1.2.0,<2",
    "python-pptx>=1.0.2,<2",
    # 新版 SAPI 驱动存在回归，保留已验证的实现。
    "pyttsx3==2.98",
    "requests>=2.34.2,<3",
    "mutagen>=1.48.1,<2",
    # 服务端鉴权需要 7.3.1 起提供的 v2 签名与日期解析。
    "edge-tts>=7.3.1,<8",
    "dashscope>=2.0.2,<3",
    "pywin32>=312,<313; sys_platform == 'win32'",
    "comtypes>=1.4.17,<2; sys_platform == 'win32'",
    "velopack>=1.2.161,<1.3",
]

[dependency-groups]
dev = ["ruff==0.17.3"]
build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false
required-version = ">=0.13.6"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    ".codex",
    ".venv",
    ".venv-*",
    ".uv-cache",
    ".uv-python",
    "build",
    "config",
    "data",
    "dist",
    "releases",
    "temp",
    "third_party",
    "Ui_mainwindow.py",
    "settingInterface.py",
    "toolsInterface.py",
    "resource_rc.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B006", "B007", "B904", "C4", "W291", "W292", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engines", "tasks", "ui", "tts_engine", "build", "release"]

[tool.ruff.format]
quote-style = "single"
